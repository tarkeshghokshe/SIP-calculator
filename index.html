<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIP Calculator</title>
  
  <link rel="icon" href="sip.jpg" type="image/png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>SIP Calculator</h1>
    <form id="sipForm">
      <label>Monthly Investment:</label>
      <input type="number" id="monthly" required>
      <label>Annual Return (%):</label>
      <input type="number" id="rate" required>
      <label>Time Period (Years):</label>
      <input type="number" id="time" required>
      <button type="submit">Calculate</button>
    </form>
    <h3 id="result"></h3>
  </div>
  <script>
    document.getElementById("sipForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let monthly = parseFloat(document.getElementById("monthly").value);
      let rate = parseFloat(document.getElementById("rate").value) / 100 / 12;
      let months = parseFloat(document.getElementById("time").value) * 12;
      let futureValue = monthly * ((Math.pow(1 + rate, months) - 1) / rate) * (1 + rate);
      document.getElementById("result").innerText = `Maturity Value: ₹${futureValue.toFixed(2)}`;
    });
  </script>
</body>
</html>
